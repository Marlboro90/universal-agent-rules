name: gitee-sync

on:
  push:
    branches: [main]
  workflow_dispatch:      # 允许在 Actions 页面手动触发一次

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整历史才能带上标签
      - name: Mirror GitHub → Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/universal-agent-rules.git"
          git push gitee "refs/remotes/origin/*:refs/heads/*" --force
          git push gitee --tags --force
          echo "镜像完成"
        # 只需要 2 个仓库 Secrets：GITEE_USER / GITEE_TOKEN（Gitee 私人令牌，走 HTTPS）
        # 镜像是单向的：Gitee 侧的 issue / PR 不回流，协作者请回 GitHub 提。
